<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">California blue curb marking</title>
  <desc id="desc">Blue-painted curb learning visual based on California disabled-parking curb-marking rules and CA MUTCD pavement and curb marking standards.</desc>
  <rect width="640" height="300" fill="#d1d5db"/>
  <rect y="165" width="640" height="135" fill="#4b5563"/>
  <rect y="132" width="640" height="36" fill="#fff"/>
  <rect y="146" width="640" height="42" fill="#1d4ed8"/>
  <text x="320" y="88" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">BLUE CURB</text>
</svg>
